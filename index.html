<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Link to your CSS file here -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Dashboard</h1>
        <!-- Navigation or user profile area could go here -->
    </header>

    <main>
        <section class="section-1">
            <h2>Section 1: Overview</h2>
            <!-- Charts, graphs, or key metrics would go here -->
            <div class="metric">
                <h3>Metric 1</h3>
                <p>Value: 100</p>
            </div>
            <div class="metric">
                <h3>Metric 2</h3>
                <p>Value: 50</p>
            </div>

        </section>

        <section class="section-2">
            <h2>Section 2: Details</h2>
            <!-- More detailed information or data tables would go here -->
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Column 1</th>
                        <th>Column 2</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Data 1</td>
                        <td>Data 2</td>
                    </tr>
                    <tr>
                        <td>Data 3</td>
                        <td>Data 4</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <!-- Copyright or other footer information -->
        <p>&copy; 2023 My Company</p>
    </footer>

    <!-- Link to your JavaScript file here -->
    <script src="script.js"></script>
</body>
</html>
